[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bgexplorer"
version = "3.0a1"
authors = [
  { name="Ben Loer", email="ben.loer@pnnl.gov" },
]
description = "Tool for modeling radioactive backgrounds in a detector"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "uncertainties",
    "numpy",
    "scipy",
    "pint",
    "blinker",
    "mongoengine",
    "mendeleev",
    "flask>=3.0",
    "flask-login",
    "flask-wtf",
    "bootstrap-flask",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = ["mongomock", "flake8"]

[project.urls]
"Homepage" = "https://github.com/bloer/bgexplorer3"
"Bug Tracker" = "https://github.com/bloer/bgexplorer3/issues"

[tool.setuptools.packge-data]
"bgexplorer.application.examples.qis_hiteffs" = ["*.json", "*.gz"]
