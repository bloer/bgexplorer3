[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgexplorer"
version = "3.0a1"
authors = [
  { name="Ben Loer", email="ben.loer@pnnl.gov" },
]
description = "Tool for modeling radioactive backgrounds in a detector"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "uncertainties",
    "numpy",
    "scipy",
    "pint",
    "blinker",
    "mongoengine",
    "mendeleev",
    "flask>=3.0",
    "flask-login",
    "flask-wtf",
    "bootstrap-flask",
    "argon2-cffi",
    "requests",
    "beautifulsoup4",
]

[project.scripts]
bgexplorer-users = "bgexplorer.cli:main"
bgexplorer-versions = "bgexplorer.cli:versions_main"

[project.optional-dependencies]
dev = ["mongomock", "flake8", "pytest"]
server = ["gunicorn"]

[project.urls]
"Homepage" = "https://github.com/bloer/bgexplorer3"
"Bug Tracker" = "https://github.com/bloer/bgexplorer3/issues"

# hatchling includes all non-gitignored files in the package (templates,
# static, example data) by default
[tool.hatch.build.targets.wheel]
packages = ["bgexplorer"]
exclude = ["*.bak"]

# tests are unittest-style, but pytest gives better reporting
[tool.pytest.ini_options]
testpaths = ["tests"]
