name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      BGEXPLORER_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/bgexplorer3_unittest
      # fail rather than skip if the mongodb service isn't reachable
      BGEXPLORER_TEST_REQUIRE_DB: "1"
      # the full example models are slow, so only test them once
      BGEXPLORER_TEST_EXAMPLES: ${{ matrix.python-version == '3.12' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
